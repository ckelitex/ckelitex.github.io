<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>CKEliteX Creator Studio</title><style>*{box-sizing:border-box}body{background:#100b19;color:#eee;font:16px system-ui;margin:auto;max-width:1000px;padding:24px}a{color:#c99aff}section,article{background:#20152e;border:1px solid #49315f;border-radius:12px;padding:18px;margin:14px 0}input,textarea,select,button{font:inherit;padding:10px;border-radius:8px;margin:5px 0;background:#30213f;color:white;border:1px solid #7750a0}input,textarea,select{width:100%}button{background:#7437b9;cursor:pointer;margin-right:8px}button:disabled{opacity:.5}label{display:block}small{color:#c4b4d7} [hidden]{display:none!important}</style><h1>👑 CKEliteX Creator Studio</h1><a href="account.html">My account</a> · <a href="clips.html">Clips Hub</a><p id="status" role="status">Checking admin access…</p><main id="studio" hidden><button id="refresh">Refresh dashboard</button><section><h2>Publish official FC27 clip</h2><form id="publish"><label>Title<input id="title" required maxlength="120"></label><label>Video link (YouTube, Twitch or TikTok)<input id="url" type="url" required></label><label>Description<textarea id="description" maxlength="2000"></textarea></label><p><small>⚽ FC27 gameplay only — goals, skills, pack openings and memorable moments.</small></p><label><input id="featured" type="checkbox" style="width:auto"> Featured clip</label><button>Publish clip</button></form></section><section><h2>Official clips</h2><div id="clips"></div></section><section><h2>FC27 Clip of the Week — entries</h2><div id="entries"></div></section><section><h2>Hall of Fame</h2><div id="winners"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id);const db=window.supabase.createClient(
  "https://bnzdbcpsrcbdrthnldpz.supabase.co",
  "sb_publishable_IRD6E_OCoJmF5sTlp3pECA_X1CE2vV-"
);let user;
const msg=s=>$('status').textContent=s;
function node(tag,s){const e=document.createElement(tag);e.textContent=s;return e}
function safe(v){try{const u=new URL(v);return u.protocol==='https:'&&['youtube.com','www.youtube.com','youtu.be','m.youtube.com','twitch.tv','www.twitch.tv','clips.twitch.tv','tiktok.com','www.tiktok.com','vm.tiktok.com','vt.tiktok.com'].includes(u.hostname)&&!u.username&&!u.password?u.href:null}catch{return null}}
function link(v){const a=node('a','Watch clip');const u=safe(v);if(u){a.href=u;a.target='_blank';a.rel='noopener noreferrer'}else a.textContent='Unsupported video link';return a}
function button(parent,label,fn){const b=node('button',label);b.type='button';b.onclick=label==='Preview uploaded clip'?async()=>{b.disabled=true;try{await fn()}catch(e){msg(e.message)}finally{b.disabled=false}}:()=>run(fn,b);parent.append(b)}
async function check(p){const r=await p;if(r.error)throw r.error;return r.data}
async function run(fn,b){if(b)b.disabled=true;try{await fn();await load();msg('Saved successfully.')}catch(e){msg(e.message||'Something went wrong')}finally{if(b)b.disabled=false}}
async function load(){const [clips,comps,entries,votes,winners]=await Promise.all(['clips','clip_competitions','clip_entries','clip_votes','clip_winners'].map(t=>check(db.from(t).select('*'))));$('clips').replaceChildren();$('entries').replaceChildren();$('winners').replaceChildren();
for(const c of clips.sort((a,b)=>b.created_at.localeCompare(a.created_at))){const el=node('article','');el.append(node('h3',c.title),link(c.video_url),node('p',c.category+' · '+(c.published?'Published':'Hidden')+(c.featured?' · Featured':'')));button(el,c.published?'Unpublish':'Publish',()=>check(db.from('clips').update({published:!c.published}).eq('id',c.id)));button(el,c.featured?'Unfeature':'Feature',()=>check(db.from('clips').update({featured:!c.featured}).eq('id',c.id)));button(el,'Edit title',async()=>{const t=prompt('New title',c.title);if(t&&t.trim())await check(db.from('clips').update({title:t.trim().slice(0,120)}).eq('id',c.id))});button(el,'Delete',async()=>{if(confirm('Delete this clip?'))await check(db.from('clips').delete().eq('id',c.id))});$('clips').append(el)}
if(!clips.length)$('clips').append(node('p','No clips yet.'));
for(const c of comps.sort((a,b)=>b.week_start.localeCompare(a.week_start))){const el=node('article','');el.append(node('h3','Week of '+c.week_start+' · '+c.status),node('p','Voting closes '+new Date(c.voting_deadline).toLocaleString('en-IE',{timeZone:'Europe/Dublin'})));const es=entries.filter(e=>e.competition_id===c.id);if(!es.length)el.append(node('p','No entries yet.'));for(const e of es){const card=node('section','');card.append(node('h4',e.title),node('p',e.category+' · '+e.status+' · '+votes.filter(v=>v.entry_id===e.id).length+' votes'));if(e.storage_path){const preview=node('div','');card.append(preview);button(card,'Preview uploaded clip',async()=>{const data=await check(db.storage.from('community-clips').createSignedUrl(e.storage_path,600));const video=document.createElement('video');video.controls=true;video.preload='metadata';video.style.maxWidth='100%';video.src=data.signedUrl;preview.replaceChildren(video);video.onloadedmetadata=()=>{preview.append(node('p','Video duration: '+video.duration.toFixed(1)+' seconds'+(video.duration>30?' — exceeds limit, reject this entry.':'')))}})}else card.append(link(e.video_url));if(c.status!=='completed'&&Date.now()<Date.parse(c.submission_deadline)){for(const s of ['approved','rejected'])button(card,s==='approved'?'Approve':'Reject',()=>check(db.from('clip_entries').update({status:s}).eq('id',e.id)))}if(c.status==='voting'&&Date.now()>=Date.parse(c.voting_deadline)&&e.status==='approved')card.append(node('p','Winner confirmation will be enabled after the weighted judging system is installed.'));el.append(card)}$('entries').append(el)}
for(const w of winners.sort((a,b)=>b.crowned_at.localeCompare(a.crowned_at)))$('winners').append(node('p','🏆 '+w.username+' · '+w.points_awarded+' EP · '+new Date(w.crowned_at).toLocaleDateString('en-IE')));if(!winners.length)$('winners').append(node('p','No champions yet.'))}
$('publish').onsubmit=e=>{e.preventDefault();const url=safe($('url').value);if(!url){msg('Use a supported HTTPS video link.');return}run(async()=>{await check(db.from('clips').insert({user_id:user.id,title:$('title').value.trim(),description:$('description').value,video_url:url,category:'FC27',featured:$('featured').checked,published:true}));e.target.reset()},e.submitter)};
$('refresh').onclick=()=>run(async()=>{},$('refresh'));
(async()=>{try{const r=await db.auth.getUser();user=r.data?.user;if(!user){msg('Please log in through My Account first.');return}if(!await check(db.rpc('is_clip_admin'))){msg('Admin access required.');return}await load();$('studio').hidden=false;msg('Admin access verified.')}catch(e){msg(e.message||'Unable to load studio')}})();
</script></html>
