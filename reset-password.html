<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CKEliteX | Secure password recovery</title><style>body{background:#151019;color:white;font:16px system-ui;margin:0;padding:24px}main{max-width:440px;margin:10vh auto;background:#21172e;padding:28px;border:1px solid #8050b4;border-radius:18px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #8050b4;font:inherit}input{background:#151019;color:white}button{background:#8050b4;color:white;cursor:pointer}a{color:#c084fc}</style></head><body><main><h1>🔒 Reset password</h1><p id="status" role="status">Checking your recovery link…</p><form id="form" hidden><label for="pw">New password</label><input id="pw" type="password" minlength="8" required autocomplete="new-password"><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="8" required autocomplete="new-password"><button id="save">Update password</button></form><a href="account.html">Back to My Account</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const $=id=>document.getElementById(id);const recovery=new URLSearchParams(location.hash.slice(1)).get("type")==="recovery";const db=window.supabase.createClient(
